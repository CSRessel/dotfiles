name: Secret scan

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks recent history and files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          python3 .github/install-tools.py --directory "$RUNNER_TEMP/dotfiles-bin" gitleaks
          echo "$RUNNER_TEMP/dotfiles-bin" >> "$GITHUB_PATH"
      - name: Scan the past year of commits
        run: python3 .github/scan-secrets.py recent
      - name: Scan current files regardless of age
        run: python3 .github/scan-secrets.py files
