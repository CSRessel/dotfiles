# A kernel OOM kill of one process inside a unit must not tear down the whole
# unit. Default is "stop", which is how a single 50 GB runaway process twice
# took an entire tmux pane scope (shell, claude, everything) with it
# (2026-07-06 python3, 2026-07-07 bun test). "continue" kills only the victim.
[Manager]
DefaultOOMPolicy=continue
