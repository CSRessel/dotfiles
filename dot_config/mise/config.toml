# Verified personal defaults. Change pins here; chezmoi apply installs them.
[tools]
# Install rustup itself; rustup owns compiler selection (including project pins).
"aqua:rust-lang/rustup" = "1.29.1"
sccache = "0.17.0"

# uv owns Python interpreters and environments.
uv = "0.12.11"

# Node retains npm compatibility; Bun provides bun and bunx.
node = "24.21.0"
bun = "1.4.2"

# Global CLI tools; projects can override kubectl for their cluster version.
kubectl = "1.37.0"
gh = "2.100.0"
# These release packages are available on Linux only.
btop = { version = "1.4.7", os = ["linux"] }
mold = { version = "2.42.0", os = ["linux"] }

[settings]
# Honor existing .nvmrc/.node-version files without loading nvm.
idiomatic_version_file_enable_tools = ["node"]

# Bootstrap interpreters are separate from their mise-managed installers.
[vars]
rust_bootstrap = "1.98.1"
python_bootstrap = "3.14.7"
