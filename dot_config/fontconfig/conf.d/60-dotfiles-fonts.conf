<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>IBM Plex Sans</family><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>IBM Plex Sans</family>
    <accept><family>Noto Sans</family></accept>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>FiraCode Nerd Font Mono</family><family>Noto Sans Mono</family></prefer>
  </alias>
</fontconfig>
